name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Show Swift version
        run: swift --version

      - name: Lint
        if: matrix.os == 'macos-26'
        run: make lint

      - name: Run unit tests
        run: make test

      - name: Build .app bundle
        run: make build

      - name: Verify local app and helper signatures
        run: |
          codesign --verify --strict --verbose=2 "build/Claude Profile Switcher.app/Contents/Helpers/ClaudeProfileDispatcher"
          codesign --verify --strict --verbose=2 "build/Claude Profile Switcher.app"

      # Snapshot artifact from main pushes. Stamped 0.0.0-dev (shallow,
      # untagged checkout) — correct for a non-release build; tagged releases
      # go through release.yml.
      - name: Zip .app for artifact
        if: github.event_name == 'push' && matrix.os == 'macos-26'
        run: ditto -c -k --sequesterRsrc --keepParent "build/Claude Profile Switcher.app" app.zip

      - name: Upload .app artifact
        if: github.event_name == 'push' && matrix.os == 'macos-26'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ClaudeProfileSwitcher-${{ github.sha }}
          path: app.zip
          retention-days: 7
