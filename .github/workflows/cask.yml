name: cask

# Renders Packaging/homebrew/claude-profile-switcher.rb into stigoleg/homebrew-tap
# when a release is published (by `make release` or the CI release workflow).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Released tag, e.g. v2.1.0
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  # Bumps the Homebrew cask in the tap repo. Requires the TAP_GITHUB_TOKEN
  # secret: a fine-grained PAT scoped to ONLY the tap repo with contents
  # read/write (the default GITHUB_TOKEN cannot push to other repos).
  # Skips gracefully while the tap/secret don't exist yet.
  update-cask:
    if: ${{ !github.event.release.prerelease && !contains(inputs.tag || github.event.release.tag_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check tap token
        id: token
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::TAP_GITHUB_TOKEN not set — skipping Homebrew cask update."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # The cask template in this repo is the source of truth, so caveats and
      # stanzas reach the tap together with the version bump.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: steps.token.outputs.skip != 'true'
        with:
          ref: ${{ env.TAG }}
          path: source
          sparse-checkout: Packaging/homebrew

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: steps.token.outputs.skip != 'true'
        with:
          repository: stigoleg/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      - name: Render cask from template
        if: steps.token.outputs.skip != 'true'
        run: |
          VERSION="${TAG#v}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/ClaudeProfileSwitcher-${VERSION}.zip"
          # Re-download the published asset so the checksum covers the exact
          # bytes users will fetch.
          curl -fsSL --retry 5 --retry-delay 5 -o app.zip "$URL"
          SHA="$(sha256sum app.zip | cut -d' ' -f1)"
          CASK=tap/Casks/claude-profile-switcher.rb
          sed -E \
            -e "s|^  version \".*\"|  version \"${VERSION}\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" \
            source/Packaging/homebrew/claude-profile-switcher.rb > "$CASK"
          grep -q "^  version \"${VERSION}\"$" "$CASK"
          grep -q "^  sha256 \"${SHA}\"$" "$CASK"
          rm app.zip

      - name: Commit and push
        if: steps.token.outputs.skip != 'true'
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "claude-profile-switcher ${TAG#v}"
          git push
