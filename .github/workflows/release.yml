name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Required: Scripts/version.sh uses `git describe --exact-match`
          # and `git rev-list --count`, both of which need full history.
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Run unit tests
        run: make test

      - name: Guard — tag must match resolved version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          RESOLVED="$(make -s version)"
          if [ "$TAG_VERSION" != "$RESOLVED" ]; then
            echo "::error::tag $TAG_VERSION != resolved version $RESOLVED"
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
        run: |
          test -n "$CERTIFICATE_P12_BASE64"
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$RUNNER_TEMP/build.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/build.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"

      - name: Build Developer ID signed app
        env:
          CODESIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEVELOPER_ID_PROVISIONING_PROFILE: ${{ runner.temp }}/DeveloperID.provisionprofile
          PROVISIONING_PROFILE_BASE64: ${{ secrets.DEVELOPER_ID_PROVISIONING_PROFILE_BASE64 }}
        run: |
          test -n "$PROVISIONING_PROFILE_BASE64"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$DEVELOPER_ID_PROVISIONING_PROFILE"
          make build

      - name: Verify code signatures and hardened runtime
        run: |
          codesign --verify --strict --verbose=2 "build/Claude Profile Switcher.app/Contents/Helpers/ClaudeProfileDispatcher"
          codesign --verify --strict --verbose=2 "build/Claude Profile Switcher.app"
          codesign -d --entitlements - "build/Claude Profile Switcher.app"
          codesign -dvv "build/Claude Profile Switcher.app/Contents/Helpers/ClaudeProfileDispatcher"

      - name: Notarize and staple app
        env:
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          test -n "$NOTARY_KEY_BASE64"
          echo "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          ditto -c -k --keepParent "build/Claude Profile Switcher.app" "$RUNNER_TEMP/notary.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notary.zip" --wait \
            --key "$RUNNER_TEMP/notary-key.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
          xcrun stapler staple "build/Claude Profile Switcher.app"
          xcrun stapler validate "build/Claude Profile Switcher.app"
          spctl --assess --type execute --verbose=4 "build/Claude Profile Switcher.app"

      - name: Package notarized release artifacts
        run: make dist-from-build

      - name: Notarize and staple DMG
        env:
          CODESIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          codesign --force --sign "$CODESIGN_IDENTITY" --timestamp dist/*.dmg
          codesign --verify --strict --verbose=2 dist/*.dmg
          echo "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          xcrun notarytool submit dist/*.dmg --wait \
            --key "$RUNNER_TEMP/notary-key.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
          xcrun stapler staple dist/*.dmg
          xcrun stapler validate dist/*.dmg
          spctl --assess --type open --context context:primary-signature --verbose=4 dist/*.dmg
          make checksums

      - name: Verify stamped version in bundle
        run: |
          STAMPED=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "build/Claude Profile Switcher.app/Contents/Info.plist")
          if [ "$STAMPED" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::bundle stamped $STAMPED, expected ${GITHUB_REF_NAME#v}"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_FLAGS=()
          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${RELEASE_FLAGS[@]}" \
            dist/*.zip dist/*.dmg dist/*.json dist/SHA256SUMS

  # Bumps the Homebrew cask in the tap repo. Requires the TAP_GITHUB_TOKEN
  # secret: a fine-grained PAT scoped to ONLY the tap repo with contents
  # read/write (the default GITHUB_TOKEN cannot push to other repos).
  # Skips gracefully while the tap/secret don't exist yet.
  update-cask:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check tap token
        id: token
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::TAP_GITHUB_TOKEN not set — skipping Homebrew cask update."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: steps.token.outputs.skip != 'true'
        with:
          repository: stigoleg/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}

      - name: Bump cask version and sha256
        if: steps.token.outputs.skip != 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/ClaudeProfileSwitcher-${VERSION}.zip"
          # Re-download the published asset so the checksum covers the exact
          # bytes users will fetch.
          curl -fsSL --retry 5 --retry-delay 5 -o app.zip "$URL"
          SHA="$(sha256sum app.zip | cut -d' ' -f1)"
          sed -i -E \
            -e "s|^  version \".*\"|  version \"${VERSION}\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" \
            Casks/claude-profile-switcher.rb
          rm app.zip

      - name: Commit and push
        if: steps.token.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "claude-profile-switcher ${GITHUB_REF_NAME#v}"
          git push
